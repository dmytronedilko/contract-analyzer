# git-cliff configuration: GitHub Release notes generated from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{%- macro commit_link(commit) -%}
  {%- if remote.github.owner -%}
    [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }})
  {%- else -%}
    `{{ commit.id | truncate(length=7, end="") }}`
  {%- endif -%}
{%- endmacro -%}
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ self::commit_link(commit=commit) }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# Groups are ordered by the HTML comment prefix, which `striptags` removes when rendering.
commit_parsers = [
  { message = "^[a-z]+\\(deps(-dev)?\\)", group = "<!-- 08 -->Dependencies" },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 03 -->Refactoring" },
  { message = "^docs", group = "<!-- 04 -->Documentation" },
  { message = "^test", group = "<!-- 05 -->Tests" },
  { message = "^build", group = "<!-- 06 -->Build" },
  { message = "^ci", group = "<!-- 07 -->CI" },
  { message = "^(chore|revert)", group = "<!-- 09 -->Chores" },
]

[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
