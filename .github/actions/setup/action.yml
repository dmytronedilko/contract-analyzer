name: Set up the workspace
description: >-
  pnpm (version from packageManager), Node from .nvmrc, dependencies from the frozen lockfile, and
  the local Turborepo cache unless Vercel Remote Cache is configured (TURBO_TOKEN/TURBO_TEAM).
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Cache Turborepo
      if: env.TURBO_TOKEN == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
