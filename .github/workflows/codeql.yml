name: CodeQL

# Advanced setup: keep CodeQL "default setup" off in the repository settings, the two conflict.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Private repositories need GitHub Code Security; apply-repo-settings.sh sets the variable.
    if: vars.CODE_SECURITY != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Needed to read workflow run information in private repositories.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # The TypeScript/JavaScript code, and the GitHub Actions workflows themselves.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
