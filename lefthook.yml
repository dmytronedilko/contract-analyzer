# Installed by the root `prepare` script (`lefthook install`).
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{js,mjs,cjs,ts,mts,cts,tsx,jsx,json,jsonc,md,yml,yaml,css,toml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,mjs,cjs,ts,mts,cts,tsx,jsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
